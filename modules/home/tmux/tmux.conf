# Set the prefix to Ctrl-a instead of Ctrl-b
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

if-shell '[ -n "$WAYLAND_DISPLAY" ]' { set copy-command wl-copy }
set exit-empty off
set exit-unattached off

# Automatically set window title
set -g automatic-rename on
# Automatically renumber windows when one is closed
set -g renumber-windows on

# Allow tmux to set terminal title
set -g set-titles on

# What neovim says to do!
set escape-time 0
set focus-events on

# Use mouse click to select terminal
set -g mouse on

# History
set -g history-limit 10000
set history-file "$XDG_STATE_HOME/tmux/history"

# Allow applications in the terminal to set the system clipboard
set -g set-clipboard on

set -g allow-passthrough on
set extended-keys on

# Styling
%hidden CAP_L=""
%hidden CAP_R=""
# A segment is drawn by setting fg to the segment colour, then reversing so the
# colour becomes the background and the text takes the terminal background
# colour. The bg reset keeps a previous segment colour from leaking in.
%hidden SEG_ON="reverse bg=terminal"
# Undo the above before drawing a cap
%hidden SEG_OFF="noreverse bg=terminal"
# Window pill
%hidden WINDOW="#[${SEG_OFF}]${CAP_L}#{?#{||:#{window_active},#{window_last_flag}},#[reverse],#[bg=colour8 fg=terminal]}#I:#W#F#{?#{||:#{window_active},#{window_last_flag}},#[${SEG_OFF}],#[bg=terminal fg=colour8]}${CAP_R}"

set -g clock-mode-style 24
set -g copy-mode-current-match-style fg=colour2,reverse
set -g copy-mode-match-style bg=colour8,fg=terminal
set -g copy-mode-mark-style bg=colour8,fg=terminal
set -g cursor-style bar
set -g message-command-style bg=colour8,fg=terminal,fill=colour8
set -g message-style bg=colour8,fg=terminal,fill=colour8
set -g mode-style reverse
set -g pane-active-border-style bg=terminal,fg=colour2,bold
set -g pane-border-format "#{pane_index} #{pane_current_command} (#{pane_pid})"
set -g pane-border-indicators colour
set -g pane-border-status top
set -g pane-border-style bg=terminal
set -g popup-border-style fg=colour2,bold
set -g prompt-cursor-style bar
set -g status-justify left
set -g status-left "#[bg=terminal fg=#{?session_grouped,colour4,colour5}]${CAP_L}#{?session_grouped,#[fg=colour4 ${SEG_ON}]#{session_group}#[noreverse bg=colour5 fg=colour4]${CAP_R},}#[fg=colour5 ${SEG_ON}]#S#[noitalics]#[${SEG_OFF} fg=colour5]${CAP_R} "
set -g status-left-length 40
set -g status-position bottom
set -g status-right " #[bg=terminal,fg=colour1]${CAP_L}#[fg=colour1 ${SEG_ON}]#h #[noreverse bg=colour1 fg=colour3]${CAP_L}#[fg=colour3 ${SEG_ON}]#(date +%Y-%m-%d) #[noreverse bg=colour3 fg=colour11]${CAP_L}#[fg=colour11 ${SEG_ON}]#(date +%H:%M)#[${SEG_OFF} fg=colour11]${CAP_R}"
set -g status-right-length 60
set -g status-style bg=terminal
set -g window-status-activity-style noreverse,bold
set -g window-status-bell-style noreverse,bold
set -g window-status-current-format "${WINDOW}"
set -g window-status-current-style fg=colour2,reverse
set -g window-status-format "${WINDOW}"
set -g window-status-style fg=colour8
set -g window-status-last-style fg=colour6,reverse
set -g window-status-separator " "
set -g window-style bg=terminal

# Use VI keybindings
set -g mode-keys vi
set -g status-keys emacs

# Reload tmux config
bind r source-file "$XDG_CONFIG_HOME/tmux/tmux.conf"

# On Cloud Desktops, $HOME is a symlink to /local/home/$USER, but
# #{pane_current_path} resolves to the physical path. Rewrite it so new
# panes/windows/sessions stay under $HOME. No-op elsewhere.
bind \\ split-window -h -c "#{s|^/local/home/|/home/|:pane_current_path}"
bind - split-window -v -c "#{s|^/local/home/|/home/|:pane_current_path}"

bind | split-window -f -h -c "#{s|^/local/home/|/home/|:pane_current_path}"
bind _ split-window -f -v -c "#{s|^/local/home/|/home/|:pane_current_path}"

# New windows will inherit current path
bind c new-window -c "#{s|^/local/home/|/home/|:pane_current_path}"

bind -r K swap-window -d -t -1
bind -r J swap-window -d -t +1
bind S display-popup -E -w 25% -h 3 "$HOME/.local/libexec/tmux/session-input"
bind s run-shell "$HOME/.local/libexec/tmux/fzf-sessions || true"

# Copy/paste
bind -T copy-mode-vi y send-keys -X copy-pipe "wl-copy && wl-paste -n | wl-copy -p"
# Feels more like Vi than <space>
bind -T copy-mode-vi v send-keys -X begin-selection
# bind v run "wl-paste -n | tmux load-buffer - ; tmux paste-buffer"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "wl-copy && wl-paste -n | wl-copy -p"

# One wheel tick is one row of scroll
bind-key -T copy-mode-vi WheelUpPane   select-pane \; send-keys -X -N 1 scroll-up
bind-key -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 1 scroll-down
